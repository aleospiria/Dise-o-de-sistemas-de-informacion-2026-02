[project]
name = "prestamos-lab-api"
version = "0.1.0"
description = "API REST para el Sistema de Préstamos de Recursos de Laboratorio"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Victor Alejandro Aristizabal Ospina" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "bcrypt>=4.2.0",
  "pyjwt>=2.10.0",
  "python-multipart>=0.0.17",
  "email-validator>=2.2.0",
  "reportlab>=4.2.0",
  "pyotp>=2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "hypothesis>=6.115.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
