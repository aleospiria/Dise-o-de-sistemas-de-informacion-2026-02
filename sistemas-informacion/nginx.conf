# Configuración de nginx para la SPA (se instala como conf.d/default.conf).
# Este archivo se incluye dentro del contexto "http", por eso puede llevar "map".

# Política de caché según la ruta. Se define con map para poder usar un único
# add_header a nivel de servidor (add_header en un location anula los heredados).
map $uri $cache_control {
    default                 "";
    ~^/assets/              "public, max-age=31536000, immutable";
    /index.html             "no-cache";
    /favicon.svg            "public, max-age=86400";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # --- Compresión ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # --- Cabeceras de seguridad ---
    # La CSP es estricta porque la app no usa scripts, estilos ni recursos externos
    # (Vite genera archivos .js/.css propios y no hay estilos inline en el HTML).
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Endpoint de salud para Docker / proxy inverso.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Archivos con hash de Vite: si no existe, 404 real (no caer en index.html).
    location /assets/ {
        try_files $uri =404;
    }

    # Fallback de la SPA: /dashboard, /loans/my, etc. sirven index.html al recargar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
