services:
  postgres:
    image: postgres:18-alpine
    container_name: sistema-prestamos-lab-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prestamos_lab}
      POSTGRES_USER: ${POSTGRES_USER:-prestamos_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prestamos_dev_password}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prestamos_app} -d ${POSTGRES_DB:-prestamos_lab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    image: sistema-prestamos-lab-api:latest
    container_name: sistema-prestamos-lab-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-prestamos_app}:${POSTGRES_PASSWORD:-prestamos_dev_password}@postgres:5432/${POSTGRES_DB:-prestamos_lab}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-en-produccion}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      EXPOSE_RESET_TOKEN: ${EXPOSE_RESET_TOKEN:-true}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-60}
      TWO_FACTOR_CHALLENGE_MINUTES: ${TWO_FACTOR_CHALLENGE_MINUTES:-5}
      TWO_FACTOR_MAX_ATTEMPTS: ${TWO_FACTOR_MAX_ATTEMPTS:-3}
      TWO_FACTOR_LOCK_MINUTES: ${TWO_FACTOR_LOCK_MINUTES:-15}
      LAB_TIMEZONE: ${LAB_TIMEZONE:-America/Bogota}
      LAB_OPEN_HOUR: ${LAB_OPEN_HOUR:-7}
      LAB_CLOSE_HOUR: ${LAB_CLOSE_HOUR:-20}
      MAX_ACTIVE_LOANS: ${MAX_ACTIVE_LOANS:-3}
      SEED_ON_STARTUP: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: ./sistemas-informacion
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: sistema-prestamos-lab-web:latest
    container_name: sistema-prestamos-lab-web
    restart: unless-stopped
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    container_name: sistema-prestamos-lab-tunnel
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
